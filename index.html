<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; script-src-attr 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; style-src-elem 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data:; connect-src 'self' https://cdnjs.cloudflare.com;">
  <title>ASTRO-BSM Product Order</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=7">
  <link rel="stylesheet" href="thermal-print.css?v=1">
  
  <!-- PWA Icons and Meta Tags -->
  <link rel="icon" type="image/png" href="public/company_logo.PNG">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png">
  
  <!-- iOS PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ASTRO-BSM">
  
  <!-- Windows PWA Support -->
  <meta name="msapplication-TileImage" content="icon-192.png">
  <meta name="msapplication-TileColor" content="#007bff">
  
  <!-- Theme Color -->
  <meta name="theme-color" content="#007bff">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@300;400;700&display=swap" rel="stylesheet">
  
  <!-- Early authentication check -->
  <script>
    // Check if user is authenticated, redirect to login if not
    const authData = localStorage.getItem('astro_auth');
    if (!authData) {
      window.location.href = 'login.html';
    } else {
      try {
        const auth = JSON.parse(authData);
        const loginTime = new Date(auth.loginTime);
        const now = new Date();
        const hoursDiff = (now - loginTime) / (1000 * 60 * 60);
        
        // Check if session expired (24 hours) or not authenticated
        if (hoursDiff >= 24 || !auth.authenticated) {
          localStorage.removeItem('astro_auth');
          window.location.href = 'login.html';
        }
      } catch (e) {
        localStorage.removeItem('astro_auth');
        window.location.href = 'login.html';
      }
    }
  </script>
</head>
<body>
  <header>
    <div class="header-container">
      <img src="public/company_logo.PNG" alt="ASTRO-BSM Logo" class="logo">
      <h1>ASTRO-BSM Product Order</h1>
      <div class="header-actions">
        <button id="notificationBtn" class="btn-notification" style="display: none;">
          🔔 <span id="notificationBadge" class="notification-badge">0</span>
        </button>
        <button id="adminBtn" class="btn-admin">Admin</button>
        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>
    </div>
  </header>

  <!-- Notification Center -->
  <div id="notificationCenter" class="notification-center" style="display: none;">
    <div class="notification-header">
      <h3>🔔 Order Notifications</h3>
      <button id="closeNotifications" class="btn-close">&times;</button>
    </div>
    <div id="notificationsList" class="notifications-list">
      <div class="notification-controls">
        <button id="clearAllNotifications" class="btn-clear">Clear All</button>
        <button id="markAllRead" class="btn-mark-read">Mark All Read</button>
      </div>
      <div id="notificationsContent"></div>
    </div>
  </div>

  <main class="container">
    <div class="card">
      <form id="orderForm">
        <fieldset class="customer-details">
          <legend>Customer Details</legend>
          <div class="form-group">
            <label for="customerName">Full Name *</label>
            <input type="text" id="customerName" name="customerName" required>
          </div>
          
          <div class="form-group">
            <label for="customerEmail">Email Address (Optional)</label>
            <input type="email" id="customerEmail" name="customerEmail">
          </div>
          
          <div class="form-group">
            <label for="customerPhone">Phone Number *</label>
            <input type="tel" id="customerPhone" name="customerPhone" required>
          </div>
          
          <div class="form-group">
            <label for="deliveryAddress">Delivery Address *</label>
            <textarea id="deliveryAddress" name="deliveryAddress" rows="3" required></textarea>
          </div>
          
          <div class="form-group">
            <label for="deliveryDate">Preferred Delivery Date *</label>
            <input type="date" id="deliveryDate" name="deliveryDate" required>
          </div>
          
          <div class="form-group">
            <label for="deliveryMethod">Preferred Delivery Method *</label>
            <select id="deliveryMethod" name="deliveryMethod" required>
              <option value="">Select delivery method</option>
              <option value="pickup_enugu">Pickup from Enugu Office</option>
              <option value="delivery_enugu">Home Delivery within Enugu</option>
              <option value="transport_bus">Transport Bus (Interstate)</option>
              <option value="courier_service">Courier Service</option>
              <option value="airline_cargo">Airline Cargo</option>
              <option value="personal_arrangement">Personal Arrangement</option>
            </select>
          </div>
          
          <div class="form-group">
            <label for="deliveryRoute">Delivery Route/Instructions</label>
            <textarea id="deliveryRoute" name="deliveryRoute" rows="2" 
                     placeholder="e.g., Via Onitsha Express, Upper Iweka Motor Park"></textarea>
          </div>
          
          <div class="form-group">
            <label for="requestStatus">Request Urgency *</label>
            <select id="requestStatus" name="requestStatus" required>
              <option value="can_wait_24hrs">Can wait for 24 hours</option>
              <option value="urgent">Urgent</option>
              <option value="very_urgent">Very Urgent</option>
            </select>
          </div>
        </fieldset>

        <fieldset class="order-items">
          <legend>Order Items</legend>
          <div id="itemsContainer"></div>
          <button type="button" id="addItemBtn" class="btn-secondary">
            <span>+</span> Add Item
          </button>
          
          <!-- Order Total Display -->
          <div id="orderTotal" class="order-total-display" style="display: none;">
            <div class="cost-breakdown">
              <div class="cost-row">
                <span>Subtotal:</span>
                <span id="subtotalAmount">₦0.00</span>
              </div>
              <div class="cost-row">
                <span>VAT (2.5%):</span>
                <span id="vatAmount">₦0.00</span>
              </div>
              <div class="cost-row total-row">
                <span><strong>Total Amount:</strong></span>
                <span id="totalAmount"><strong>₦0.00</strong></span>
              </div>
              <div class="cost-row words-row" style="margin-top: 10px; font-style: italic; font-size: 0.9em; color: #6b7280;">
                <span id="totalAmountWords">Amount in Words: </span>
              </div>
            </div>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Submit Order</button>
        </div>
      </form>
    </div>

    <div id="orderSummary" class="card summary-card"></div>
    
    <!-- Admin Modal -->
    <div id="adminModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Admin Access</h2>
        <div id="passwordSection">
          <label for="adminModalPassword">Enter Password:</label>
          <input type="password" id="adminModalPassword" placeholder="Password">
          <button id="loginBtn" class="btn-primary">Login</button>
        </div>
        <div id="ordersSection" style="display: none;">
          <h3>All Orders</h3>
          <div style="margin-bottom: 20px;">
            <button id="manageProductsBtn" class="btn-secondary">🛠️ Manage Products</button>
            <button id="manageStockBtn" class="btn-secondary">📦 Stock Management</button>
          </div>
          <div id="ordersList"></div>
        </div>
        
        <!-- Stock Management Section -->
        <div id="stockSection" style="display: none;">
          <h3>Stock Management</h3>
          <div style="margin-bottom: 20px;">
            <button id="viewStockLevels" class="btn-primary">📊 View Stock Levels</button>
            <button id="addStockIntake" class="btn-primary">➕ Add Stock</button>
            <button id="viewStockAlerts" class="btn-warning">⚠️ Low Stock Alerts</button>
            <button id="backToOrders" class="btn-secondary">← Back to Orders</button>
          </div>
          
          <!-- Stock Levels Display -->
          <div id="stockLevelsDisplay" style="display: none;"></div>
          
          <!-- Stock Intake Form -->
          <div id="stockIntakeForm" style="display: none; margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px;">
            <h4>Add Stock Intake</h4>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
              <select id="stockProductSelect" required>
                <option value="">Select Product</option>
              </select>
              <input type="number" id="stockQuantity" placeholder="Quantity to Add" min="1" required>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
              <input type="number" id="stockCostPerUnit" placeholder="Cost per Unit (₦)" step="0.01">
              <input type="text" id="stockSupplier" placeholder="Supplier Name">
            </div>
            <input type="text" id="stockBatchNumber" placeholder="Batch Number (optional)" style="margin-bottom: 10px;">
            <input type="date" id="stockExpiryDate" style="margin-bottom: 10px;">
            <textarea id="stockNotes" placeholder="Notes (optional)" rows="3" style="margin-bottom: 10px;"></textarea>
            <div>
              <button id="submitStockIntake" class="btn-primary">Add Stock</button>
              <button id="cancelStockIntake" class="btn-secondary">Cancel</button>
            </div>
          </div>
          
          <!-- Stock Alerts Display -->
          <div id="stockAlertsDisplay" style="display: none;"></div>
        </div>
      </div>
    </div>

    <!-- Product Management Modal -->
    <div id="productModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Product Management</h2>
        
        <div style="margin-bottom: 20px;">
          <button id="addProductBtn" class="btn-primary">+ Add New Product</button>
        </div>

        <!-- Add Product Form -->
        <div id="addProductForm" style="display: none; margin-bottom: 20px; padding: 15px; border: 1px solid #ddd; border-radius: 8px;">
          <h3>Add New Product</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px;">
            <input type="text" id="newProductName" placeholder="Product Name" required>
            <input type="number" id="newProductPrice" placeholder="Price (₦)" step="0.01" required>
          </div>
          <textarea id="newProductDescription" placeholder="Description (optional)" rows="3"></textarea>
          <div style="margin-top: 10px;">
            <button id="saveProductBtn" class="btn-primary">Save Product</button>
            <button id="cancelProductBtn" class="btn-secondary">Cancel</button>
          </div>
        </div>

        <!-- Products List -->
        <div id="productsList"></div>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2025 ASTRO-BSM. All rights reserved.</p>
  </footer>

  <!-- Load authentication first -->
  <script src="auth.js"></script>
  
  <!-- External libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  
  <!-- Application scripts -->
  <script src="naira-converter.js"></script>
  <script src="payment-receipt.js"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
